<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대한민국 해병대 메타버스 웹사이트</title>

    <!-- 애플 느낌 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f9f9f9;
            color: #111;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
            text-align: center;
        }

        /* 공지사항 타이틀 */
        .notice-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #8B0000; /* 해병대 레드 */
            margin-bottom: 30px;
        }

        /* 이미지 영역 */
        .notice-image {
            width: 100%;
            height: 320px;
            background-color: #ddd;
            background-position: center;
            background-size: cover;
            border-radius: 18px;
            margin-bottom: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        /* 설명 텍스트 */
        .notice-text {
            max-width: 880px;
            margin: 0 auto;
            font-size: 19px;
            line-height: 1.9;
            color: #333;
        }

        /* 상단 라인 (고급 포인트) */
        .top-line {
            width: 80px;
            height: 4px;
            background-color: #8B0000;
            margin: 0 auto 25px auto;
            border-radius: 10px;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .notice-title {
                font-size: 32px;
            }

            .notice-image {
                height: 220px;
            }

            .notice-text {
                font-size: 16px;
            }
        }
        /* 저작권 */
.footer {
    margin-top: 80px;
    font-size: 13px;
    color: #777;
    text-align: center;
}

    </style>
</head>
<body>

    <div class="container">
        <div class="top-line"></div>

        <div class="notice-title">공지사항</div>

        <!-- 이미지 -->
        <div class="notice-image"
             style="background-image: url('https://cdn.discordapp.com/attachments/1449729254748065804/1455744908856918190/wegfewrgergre.png?ex=6955d798&is=69548618&hm=7dab4b9a3bac54b775ced5c0d3118491d8bf2d73eb2a2d7d8c7a669b9129f957');">
        </div>

        <!-- 설명 -->
        <div class="notice-text">
            해병대 메타버스 건의사항 채널을 통해 제안된 의견 중<br><br>
            운영에 큰 도움이 되는 우수한 아이디어를 제시한 분께는
            소정의 상품을 제공할 예정입니다.
            많은 관심과 적극적인 참여 바랍니다.<br><br>
            앞으로 더욱 더 발전하는 해병대로 남길,
            노력하고 더 노력하겠습니다.
        </div>
    </div>

    <div class="footer">
    © 2025 임승현. All rights reserved.
</div>


</body>
</html>
